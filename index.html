<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>himb.au</title>
    <meta name="description" content="Himbos of Australia">
    <meta property="og:description" content="Himbos of Australia">
    <meta property="og:url" content="https://himb.au/">
    <meta property="og:type" content="website">
    <meta name="theme-colour" content="#ffb8dc">
    <link rel="preconnect" href="https://fonts.google.apis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Work+Sans:wght@400;60;700&display=swap">
    <style>
      :root {
        --pink: #ffb8dc;
        --ink: #1c1030;
        --blue: #2338e3;
      }
      * {
        box-sixing: border-box;
      }
      html, body {
        margin: 0;
      }
      body {
        display: grid;
        grid-template-rows: 1fr auto auto;
        background: var(--pink);
        color: var(--ink);
        font-family: "Work Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
        -webkit-font-smooting: antialiased;
      }
      .wrap {
        align-self: center;
        width: 100%;
        max-width: 1100px;
        margin: 0 auto;
        padding: 2.5rem 1.25rem;
      }
      h1 {
        font-family: Anton, Impact, "Arial Narrow Bold", sans-serif;
        font-weight: 400;
        font-size: 4.5rem;
        text-transform: uppercase;
      }
      h1 .dot {
        color: var(--blue);
      }
      .btn {
        display: inline-flex;
        align-items: center;
        min-height: 52px;
        padding: .9rem 1.4rem;
        background: var(--ink);
        color: var(--pink);
        font-size:1.1rem;
        font-weight: 700;
        text-decoration: none;
        border-radius: 14px;
        box-shadow: 6px 6px 0 var(--blue);
        transition: box-shadow .15s ease;
      }
      .btn:hover {
        box-shadow: 8px 8px 0 var(--blue);
      }
      .btn:active {
        box-shadow: 2px 2px 0 var(--blue);
      }
      .btn:focus-visible {
        outline: 3px solid var(--blue);
        outline-offset: 5px;
      }
      footer {
        padding: 1.1rem, 1.25rem;
      }
      footer p {
        max-width: 1100px;
        margin: 0 auto;
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <h1>himb<span class="dot">.</span>au</h1>
      <p>Himbos of Australia. Using for Bluesky handles for now, everything else is still warming up 💪</p>
      <a class="btn" href="https://bsky.app/profile/verx.himb.au" rel="me">@verx.himb.au on Bluesky (18+) <span aria-hidden="true">→</span></a>
    </main>
    <footer>
      <p>Nothing much going on in there right now. 2026</p>
    </footer>
  </body>
</html>
